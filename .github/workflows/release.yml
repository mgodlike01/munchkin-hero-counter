name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Check version and public files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; if ("v" + JSON.parse(fs.readFileSync("package.json")).version !== process.env.RELEASE_TAG) process.exit(1)'
          python3 scripts/check-public-files.py --tracked
          python3 scripts/test-public-files.py
      - run: npm ci
      - run: npm run check
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Package and verify archives
        run: |
          python3 scripts/package-vps.py
          python3 scripts/verify-packages.py
      - name: Installer checks in a disposable container
        run: |
          docker build -f deploy/ip/test.Dockerfile -t munchkin-installer-check deploy/ip
          docker run --rm --network none -v "$PWD/deploy/ip:/config:ro" -v "$PWD/dist:/release:ro" munchkin-installer-check bash /config/test-secure-update.sh
          docker run --rm --network none -v "$PWD/deploy/ip:/config:ro" -v "$PWD/artifacts:/packages:ro" munchkin-installer-check python3 /config/test-setup.py
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
            --notes-file .github/release-notes.md \
            artifacts/munchkin-vps-ip.tar.gz artifacts/munchkin-static.zip \
            artifacts/munchkin-source.tar.gz artifacts/SHA256SUMS.txt
