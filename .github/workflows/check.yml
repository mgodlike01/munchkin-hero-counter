name: Checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Check public files
        run: |
          python3 scripts/check-public-files.py --tracked
          python3 scripts/test-public-files.py
      - run: npm ci
      - run: npm run check
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Package and verify archives
        run: |
          python3 scripts/package-vps.py
          python3 scripts/verify-packages.py
      - name: Installer checks in a disposable container
        run: |
          docker build -f deploy/ip/test.Dockerfile -t munchkin-installer-check deploy/ip
          docker run --rm --network none -v "$PWD/deploy/ip:/config:ro" -v "$PWD/dist:/release:ro" munchkin-installer-check bash /config/test-secure-update.sh
          docker run --rm --network none -v "$PWD/deploy/ip:/config:ro" -v "$PWD/artifacts:/packages:ro" munchkin-installer-check python3 /config/test-setup.py
