map $uri $munchkin_cache_control {
    default "no-cache";
    /sw.js "no-cache, no-store, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Keep all headers at the same level: location add_header would cancel inheritance.
    add_header Cache-Control $munchkin_cache_control always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
    }

    location /assets/ {
        try_files $uri =404;
    }

    location ~* \.(?:png|svg)$ {
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
}
